title: Join the team
intro: We are looking for Politecnico di Torino students who have the interest and passion to design, build and test a real machine.
body: |
  You don't need experience with concrete. Bring what you study, and we will find the part of the printer where it counts.

  - Hands-on work on real hardware, from design to testing
  - Guidance from DISEG faculty
  - A multidisciplinary team and international collaborations

apply:
