<footer class="site-footer">
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <img src="/assets/img/logo-concretoprint-160.png" width="64" height="64" alt="{{ site.name }} logo">
        <p>{{ site.footer.blurb }}</p>
      </div>
      {% for group in site.footer.groups %}
      <div>
        <h2>{{ group.title }}</h2>
        <ul>
          {% for link in group.links %}
          <li><a href="{{ link.href }}">{{ link.label }}</a></li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
    <div class="foot-bottom">
      <p>{{ site.footer.note }}</p>
    </div>
  </div>
</footer>
